name: 카드 묶음 만들기

on:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 (한국 시간), 카드 45장
  workflow_dispatch:
    inputs:
      count:
        description: '만들 카드 수, 꼬리 물기 카드 포함 (비우면 첫 실행 90, 이후 45)'
        required: false
        default: ''
      models:
        description: '모델 목록 (비우면 기본값, 시험용)'
        required: false
        default: ''
      thinking:
        description: '생각 수준 minimal/low/medium/high (비우면 기본값, 시험용)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: generate-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 카드 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COUNT: ${{ github.event.inputs.count }}
          MODELS: ${{ github.event.inputs.models }}
          THINKING_LEVEL: ${{ github.event.inputs.thinking }}
          MAX_MINUTES: '240'
        run: node scripts/generate.mjs

      # 생성이 중간에 멈춰도 저장된 묶음은 올린다
      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "kkaeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards usage.json 2>/dev/null || git add cards
          if git diff --cached --quiet; then
            echo "새 카드 없음"
          else
            git commit -m "cards: $(date -u +%Y-%m-%d) 카드 묶음 추가"
            git push
          fi

      # 예상 지출이 예산의 80%·100%에 닿으면 이슈로 알림 (@멘션 → GitHub 알림·메일)
      - name: 지출 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f budget-alert.md ]; then
            gh issue create --title "$(head -n 1 budget-alert.md)" --body "$(tail -n +3 budget-alert.md)"
          fi
